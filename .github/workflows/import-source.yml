name: Import audited source snapshot
on:
  push:
    paths:
      - source.bundle
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Colezhm/mosaico-coopanion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish exact audited source tree
        shell: bash
        run: |
          set -euo pipefail
          echo '2b50b3634dc8e3f6691445c9ae9f50580f155da7f5193d6296dd7c705e1f821d  source.bundle' | sha256sum --check
          git bundle verify source.bundle
          git fetch ./source.bundle refs/exports/mosaico-source:refs/heads/audited-source
          test "$(git rev-parse audited-source)" = 'daf2dcc26bf831d1f60446f2b3ae5b46db70a46c'
          test "$(git rev-parse 'audited-source^{tree}')" = '967a9539cdd52e5c591c7dd5b5b66acc67142e7d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=$(printf '%s\n' 'Publish Mosaico Coopanion candidate (local source 944a5cc)' | git commit-tree 'audited-source^{tree}' -p "$GITHUB_SHA" -p audited-source)
          git push origin "$published:refs/heads/main"
          echo "Published exact source tree: 967a9539cdd52e5c591c7dd5b5b66acc67142e7d"
