<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="pet.css"><style>html,body{margin:0;background:transparent!important;overflow:hidden}svg{display:block}</style></head><body><svg id="coo" width="192" height="216" viewBox="-32 -48 320 360"></svg><style id="skin"></style><script type="module">
import {figure,FACES,STAND,normalizeSkin,skinVars} from './pet-core.js';
window.pose=(name,skin)=>{
  const s=normalizeSkin(skin),v=skinVars(s,true); document.querySelector('#skin').textContent=`:root{${v}}`;
  let legs=STAND.map(x=>[...x]),low=0,t=0,face=FACES[name]||FACES.neutral;
  if(name.startsWith('walk')){t=Number(name.slice(4))/8;for(let i=0;i<2;i++){legs[i][2]+=Math.sin(t*Math.PI*2+i*Math.PI)*25;legs[i][3]-=Math.max(0,Math.cos(t*Math.PI*2+i*Math.PI))*18;}}
  if(name==='sit'||name==='sleep'){low=30;legs=legs.map(l=>[l[0],l[1]+30,l[2]+18,256]);}
  document.querySelector('#coo').innerHTML=figure(face.f(t),{look:[0,0],legs,low,t,blink:0,acc:s,swing:0});
  return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
window.ready=true;
</script></body></html>
